workflow:
  steps:
    qvi_aid:
      id: 'qvi_aid'
      type: 'create_aid_kli'
      aid: 'qvi-aid-1'
      description: 'Creating AID: qvi-aid-1 via KLI'
    le_aid_1:
      id: 'le_aid_1'
      type: 'create_aid_kli'
      aid: 'le-aid-1'
      description: 'Creating AID: le-aid-1 via KLI'
    le_aid_2:
      id: 'le_aid_2'
      type: 'create_aid_kli'
      aid: 'le-aid-2'
      description: 'Creating AID: le-aid-2 via KLI'
    le_aid_3:
      id: 'le_aid_3'
      type: 'create_aid_kli'
      aid: 'le-aid-3'
      description: 'Creating AID: le-aid-3 via KLI'
    le_aid_multisig_1:
      id: 'le_aid_multisig_1'
      type: 'create_aid_kli'
      initiator: 'le-aid-1'
      aid: 'le-multisig-1'
      description: 'Creating AID: le-multisig-1 via KLI'
    confirm_delegation_kli_qvi_to_le_multisig_1:
      id: 'confirm_delegation_kli_qvi_to_le_multisig_1'
      type: 'confirm_delegation_kli'
      delegator_aid: 'qvi-aid-1'
      delegate_aid: 'le-multisig-1'
      description: 'Confirming delegation of LE multisig 1 by QVI via KLI'
    qvi_cred:
      id: 'qvi_cred'
      type: 'issue_credential_kli'
      attributes:
        LEI: '254900OPPU84GM83MG36'
      issuer_aid: 'qvi-aid-1'
      issuee_aid: 'qvi-aid-1'
      description: 'QVI issues QVI vLEI credential'
      credential: 'qvi_vlei_cred'
