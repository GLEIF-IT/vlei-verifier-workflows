configs:
  wan.json:
    content: |
      {
          "dt": "2022-01-20T12:57:59.823350+00:00",
          "wan": {
            "dt": "2022-01-20T12:57:59.823350+00:00",
            "curls": ["tcp://localhost:5632/", "http://localhost:5642/"]
          },
      }

  wil.json:
    content: |
      {
          "dt": "2022-01-20T12:57:59.823350+00:00",
          "wil": {
              "dt": "2022-01-20T12:57:59.823350+00:00",
              "curls": ["tcp://localhost:5633/", "http://localhost:5643/"]
          }
      }
  wes.json:
    content: |
      {
          "dt": "2022-01-20T12:57:59.823350+00:00",
          "wes": {
              "dt": "2022-01-20T12:57:59.823350+00:00",
              "curls": ["tcp://localhost:5634/", "http://localhost:5644/"]
          }
      }

services:
  vlei-server:
    image: gleif/vlei:0.2.0
    # image: vlei-server-local:latest
    # network_mode: host
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=UTF-8
    command:
      - vLEI-server
      - -s
      - ./schema/acdc
      - -c
      - ./samples/acdc/
      - -o
      - ./samples/oobis/
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-f',
          'http://vlei-server:7723/oobi/EBfdlu8R27Fbx-ehrqwImnK-8Cm79sqbAQ4MmvEAYqao',
        ]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 2s
    ports:
      - 7723:7723

  witness-demo:
    image: gleif/keri-witness-demo:1.2.7
    # network_mode: host
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=UTF-8
    healthcheck:
      test: ['CMD', 'wget', '--spider', 'http://witness-demo:5642/oobi']
      interval: 2s
      timeout: 3s
      retries: 2
      start_period: 2s
    configs:
      - source: wan.json
        target: /keripy/scripts/keri/cf/main/wan.json
      - source: wes.json
        target: /keripy/scripts/keri/cf/main/wes.json
      - source: wil.json
        target: /keripy/scripts/keri/cf/main/wil.json
    ports:
      - 5642:5642
      - 5643:5643
      - 5644:5644
      - 5632:5632
      - 5633:5633
      - 5634:5634

  deps:
    image: alpine:latest
    command: ['echo', 'Dependencies running']
    depends_on:
      vlei-server:
        condition: service_healthy
      witness-demo:
        condition: service_healthy
