name: Singlesig Credential Revocation test
on:
  # push:
  #   branches:
  #     - 'master'
  # pull_request:
  #   branches:
  #     - '**' # Run Validate Build on all PR branches
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  test-singlesig-revocation:
    name: Run singlesig credential revocation test using keria:${{ matrix.keria-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    strategy:
      matrix:
        keria-version: ['0.2.0-dev3']
        node-version: ['22']
    env:
      KERIA_IMAGE_TAG: ${{ matrix.keria-version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run docker
        run: |
          docker compose down -v
          docker compose up verify -d --pull always

      - name: Build
        run: pnpm run build

      - name: Run workflow
        run: WORKFLOW=revocation-test-singlesig.yaml CONFIGURATION=configuration-revocation-test-singlesig.json pnpm exec jest ./run-workflow.test.ts --runInBand --detectOpenHandles --forceExit
