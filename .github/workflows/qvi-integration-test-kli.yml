name: QVI Integration Test - KLI

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      keri_version:
        description: 'Version of KERI to test against'
        required: true
        default: '1.2.17'

permissions:
  actions: read
  contents: read

jobs:
  qvi-integration-test-kli:
    name: Run QVI Integration test using KLI:${{ matrix.keria-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    strategy:
      matrix:
        keria-version: ['0.4.4']
        node-version: ['22']
    env:
      KERIA_IMAGE_TAG: ${{ matrix.keria-version }}
      KERI_VERSION: ${{ github.event.inputs.keri_version || '1.2.17' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install keripy dependencies
        run: |
          python -m ensurepip --upgrade
          pip install git+https://github.com/GLEIF-IT/keripy.git@${{ env.KERI_VERSION }}

      - name: Run docker
        run: |
          docker compose down -v
          docker compose -f docker-compose-kli-tests.yaml up deps -d --pull always

      - name: Build
        run: pnpm run build

      - name: Run workflow
        run: WORKFLOW=create-aid-kli.yaml CONFIGURATION=configuration-create-aid-kli.json NODE_OPTIONS=--experimental-vm-modules pnpm exec jest ./run-workflow.test.ts --runInBand --detectOpenHandles --forceExit
