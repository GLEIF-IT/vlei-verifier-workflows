name: Validate Build

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '**' # Run Validate Build on all PR branches
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  validate-build:
    name: Validate Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    strategy:
      matrix:
        node-version: ['20']
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run linter

      - name: Run Prettier
        run: pnpm run formatter

      - name: Run dependency check
        run: pnpm run dependency-checker

      - name: Run unit tests
        run: pnpm test --runInBand --watchAll=false --runTestsByPath ./test/unit/utils.test.ts

      - name: Run Build
        run: pnpm run build

      - name: Run compatibility check
        run: bash ./build/test/package/check-compatibility.sh
