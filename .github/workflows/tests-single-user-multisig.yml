name: Multisig Single-User Test
on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - '**' # Run Validate Build on all PR branches
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  test-single-aid-multisig:
    name: Run multisig single-user test using keria:${{ matrix.keria-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    strategy:
      matrix:
        keria-version: ['0.4.6']
        node-version: ['22']
    env:
      KERIA_IMAGE_TAG: ${{ matrix.keria-version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run docker
        run: |
          docker compose down -v
          docker compose up verify -d --pull always

      - name: Build
        run: pnpm run build

      - name: Run workflow
        run: WORKFLOW=multisig-single-user.yaml CONFIGURATION=configuration-multisig-single-user.json NODE_OPTIONS=--experimental-vm-modules pnpm exec jest ./run-workflow.test.ts --runInBand --detectOpenHandles --forceExit
